name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Gemspec floor is >= 2.5. ubuntu-latest no longer ships 2.5 binaries;
        # run that cell on ubuntu-22.04. Also cover 2.6 and 3.1–3.3.
        os: [ubuntu-latest]
        ruby-version: ['2.6', '3.1', '3.2', '3.3']
        include:
          - os: ubuntu-22.04
            ruby-version: '2.5'
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - run: bundle exec rake spec
